name: paratletismo

services:
  - type: web
    name: paratletismo-backend
    runtime: python
    plan: free
    healthCheckPath: /api/health/
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    startCommand: gunicorn paratletismo_core.wsgi --bind 0.0.0.0:$PORT --workers 2 --threads 2
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "false"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://paratletismo-frontend.pages.dev,http://localhost:5173,http://localhost:3000"
      - key: DATABASE_URL
        fromDatabase:
          name: paratletismo-db
          property: connectionString

databases:
  - name: paratletismo-db
    plan: free